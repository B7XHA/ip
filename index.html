<script>
// وظيفة فتح الإعلان المخفي (Direct Link)
function openAdPop() {
    window.open('https://pl28700469.effectivegatecpm.com/89/a6/b8/89a6b8558224cd67c0822829d68a87ad.js', '_blank');
    document.getElementById('ad-layer').style.display = 'none'; // تختفي بعد أول ضغطة
}

function cleanInput(str) {
    return str.replace(/^(?:https?:\/\/)?(?:www\.)?/i, "").split('/')[0];
}

function startHack() {
    let raw = document.getElementById("targetInput").value.trim();
    let term = document.getElementById("terminal");

    if (!raw) { alert("NO TARGET SPECIFIED!"); return; }

    let target = cleanInput(raw);
    term.innerHTML = `<span class="header-text">[*] TARGET IDENTIFIED: ${target}</span>\n`;
    
    let logs = [
        "[+] Initializing deep packet inspection...",
        "[+] Bypassing regional geo-blocks...",
        "[+] Scanning for open ports (80, 443, 21, 22)...",
        "[+] Intercepting DNS handshakes...",
        "[+] Extracting metadata from server headers...",
        "[+] Finalizing data decryption..."
    ];

    let i = 0;
    let interval = setInterval(() => {
        if (i < logs.length) {
            term.innerHTML += `> ${logs[i]}\n`;
            i++;
        } else {
            clearInterval(interval);
            getDetailedData(target);
        }
    }, 500);
}

function getDetailedData(target) {
    let term = document.getElementById("terminal");
    
    fetch(`https://ipapi.co/${target}/json/`)
    .then(res => res.json())
    .then(d => {
        if (d.ip) {
            term.innerHTML += `\n<span class="header-text">======= FULL EXPLOIT REPORT =======</span>\n`;
            
            // جلب كل المعلومات الممكنة من الـ API
            let fullReport = `
<span class="info-label">IP ADDRESS:</span>    <span class="info-value">${d.ip}</span>
<span class="info-label">VERSION:</span>       <span class="info-value">${d.version || 'IPv4'}</span>
<span class="info-label">CITY:</span>          <span class="info-value">${d.city}</span>
<span class="info-label">REGION:</span>        <span class="info-value">${d.region} (${d.region_code})</span>
<span class="info-label">COUNTRY:</span>       <span class="info-value">${d.country_name} (${d.country_code})</span>
<span class="info-label">CONTINENT:</span>     <span class="info-value">${d.continent_code}</span>
<span class="info-label">POSTAL CODE:</span>   <span class="info-value">${d.postal}</span>
<span class="info-label">LATITUDE:</span>      <span class="info-value">${d.latitude}</span>
<span class="info-label">LONGITUDE:</span>     <span class="info-value">${d.longitude}</span>
<span class="info-label">TIMEZONE:</span>      <span class="info-value">${d.timezone}</span>
<span class="info-label">UTC OFFSET:</span>    <span class="info-value">${d.utc_offset}</span>
<span class="info-label">CALLING CODE:</span>  <span class="info-value">${d.country_calling_code}</span>
<span class="info-label">CURRENCY:</span>      <span class="info-value">${d.currency_name} (${d.currency})</span>
<span class="info-label">LANGUAGES:</span>     <span class="info-value">${d.languages}</span>
<span class="info-label">ORG (ISP):</span>     <span class="info-value">${d.org}</span>
<span class="info-label">ASN:</span>           <span class="info-value">${d.asn}</span>
            `;
            
            term.innerHTML += fullReport;
            term.innerHTML += `\n<span class="header-text">====================================</span>\n[!] STATUS: COMPROMISED.`;
        } else {
            term.innerHTML += `\n<span style="color:red;">[!!] FATAL ERROR: TARGET NOT FOUND [!!]</span>`;
        }
    })
    .catch(() => {
        term.innerHTML += `\n<span style="color:red;">[!!] CONNECTION TIMEOUT.</span>`;
    });
}
</script>
