<script>
// وظيفة فتح الإعلان الخفي
function openHiddenAd() {
    // نفتح رابط الإعلان الخاص بك في نافذة جديدة

function cleanDomain(url) {
    return url.replace(/^(?:https?:\/\/)?(?:www\.)?/i, "").split('/')[0];
}

function startHack() {
    let input = document.getElementById("ipInput").value.trim();
    let terminal = document.getElementById("terminal");

    if (!input) {
        alert("CRITICAL ERROR: TARGET MISSING");
        return;
    }

    let target = cleanDomain(input);
    terminal.innerHTML = "Initializing Attack on: " + target + "\n";
    
    let steps = [
        "Scanning target ports...",
        "Bypassing firewalls...",
        "Injecting SQL payloads...",
        "Retrieving admin credentials..."
    ];

    let i = 0;
    let interval = setInterval(() => {
        if (i < steps.length) {
            terminal.innerHTML += ">> " + steps[i] + "\n";
            i++;
        } else {
            clearInterval(interval);
            fetchTargetData(target);
        }
    }, 600);
}

function fetchTargetData(target) {
    let terminal = document.getElementById("terminal");
    fetch(`https://ipapi.co/${target}/json/`)
    .then(res => res.json())
    .then(data => {
        if (data.ip) {
            terminal.innerHTML += `\n[ SUCCESS ]\nIP: ${data.ip}\nOrg: ${data.org}\nCity: ${data.city}\nCountry: ${data.country_name}\n`;
        } else {
            terminal.innerHTML += `\n[ FAILED ] Could not resolve domain.`;
        }
    })
    .catch(() => {
        terminal.innerHTML += `\n[ ERROR ] API Connection lost.`;
    });
}
