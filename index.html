<h1>💻 Hacker Simulator</h1>

<input type="text" id="ipInput" placeholder="Enter IP or Website URL (e.g. google.com)">

<div id="terminal">Ready for instructions...</div>

<button onclick="startHack()">Start Hack</button>

<div id="container-596225155ab3da796681d551cb4b7cf4"></div>

<script>
// وظيفة لتنظيف المدخلات (تحويل الرابط إلى اسم النطاق فقط)
function cleanInput(input) {
    return input.replace(/(^\w+:|^)\/\//, '').split('/')[0];
}

let lines = [
    "Establishing secure connection...",
    "Injecting brute-force scripts...",
    "Bypassing firewall layers...",
    "Scanning open ports...",
    "Extracting server information..."
];

function startHack() {
    let rawInput = document.getElementById("ipInput").value.trim();
    let terminal = document.getElementById("terminal");

    if (!rawInput) {
        alert("Enter IP or Domain first");
        return;
    }

    let target = cleanInput(rawInput);
    terminal.innerHTML = "";
    let i = 0;

    let interval = setInterval(() => {
        if (i < lines.length) {
            terminal.innerHTML += "> " + lines[i] + "<br>";
            i++;
        } else {
            clearInterval(interval);
            getIPInfo(target);
        }
    }, 700);
}

function getIPInfo(target) {
    let terminal = document.getElementById("terminal");

    // استخدام API يدعم CORS والبحث بالدومين
    fetch(`https://ipapi.co/${target}/json/`)
    .then(res => res.json())
    .then(data => {
        terminal.innerHTML += "<br>";

        if (!data.error) {
            terminal.innerHTML += "<span style='color:white'>[+] ACCESS GRANTED ✔</span><br>";
            terminal.innerHTML += "================ RESULT ================<br>";
            terminal.innerHTML += `
Target:    ${target}
IP Address: ${data.ip}
City:      ${data.city}
Region:    ${data.region}
Country:   ${data.country_name}
ISP:       ${data.org}
ASN:       ${data.asn}
Lat/Lon:   ${data.latitude}, ${data.longitude}
            `;
            terminal.innerHTML += "<br>========================================<br>";
        } else {
            terminal.innerHTML += "<span style='color:red'>[!] Access Denied: Target Not Found</span><br>";
        }
    })
    .catch(() => {
        terminal.innerHTML += "<br><span style='color:red'>[!] Connection Failed (API Error)</span>";
    });
}
</script>
