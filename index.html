function cleanDomain(url) {
    return url.replace(/^(?:https?:\/\/)?(?:www\.)?/i, "").split('/')[0];
}

function startHack() {

    if (!input) {
        alert("CRITICAL ERROR: NO TARGET DEFINED!");
        return;
